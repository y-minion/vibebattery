name: macOS build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test policies and stores
        run: swift test --disable-xctest
      - name: Smoke test scoped terminal sessions
        run: python3 scripts/smoke-sessions.py .build/debug/vbctl
      - name: Build app bundle
        run: scripts/build-app.sh
      - name: Check helper scripts
        run: sh -n scripts/install-helper.sh && sh -n scripts/uninstall-helper.sh
      - name: Read charge limit (read-only, runner may report unsupported)
        run: dist/VibeBattery.app/Contents/MacOS/vbctl charge status
      - name: Read health report (read-only, runner may have no battery)
        run: dist/VibeBattery.app/Contents/MacOS/vbctl health && dist/VibeBattery.app/Contents/MacOS/vbctl health --json
      - name: Smoke test embedded release tool
        run: python3 scripts/smoke-sessions.py dist/VibeBattery.app/Contents/MacOS/vbctl
